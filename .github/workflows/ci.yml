name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.11'
      - run: uv pip install -e ".[dev]"
      - name: Lint
        run: uv run --no-sync ruff check .
      - name: Tests
        run: uv run --no-sync pytest
      - name: Reproduce findings from the cached dataset
        run: PYTHONPATH=src uv run --no-sync python -m bridge.report
