[project]
name = "brooklyn-bridge-pedestrians"
version = "1.0.0"
description = "What drives foot traffic on the Brooklyn Bridge: hourly patterns, weather effects and a forecast model"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2", "numpy>=1.26", "scikit-learn>=1.5", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bridge"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["notebooks"]  # the original assignment notebook is kept as submitted

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "NPY", "PD"]
ignore = ["E402", "PD013"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
